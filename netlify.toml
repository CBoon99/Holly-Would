# Holly Would — Netlify (site: holly-would)
#
# UI / API settings (must match Devils Advocates monorepo fix):
#   Base directory:     (blank)
#   Package directory:  web
#   Build command:      npm run build
#   Publish directory:  .next
#   Node:               22
#
# Next.js runtime auto-provisions the adapter — do not pin [[plugins]] at root.
# App-level env headers live in web/netlify.toml when package_path=web.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  DATA_DIR = "/tmp/holly-would-data"
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_ENABLED = "false"
