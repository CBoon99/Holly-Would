# Holly Would — Netlify (site: holly-would)
#
# Site settings (API / UI):
#   Base directory:     (blank)
#   Package directory:  web
#   Build command:      npm run build
#   Publish directory:  (BLANK — Next runtime must own this)
#   Node:               22
#
# Do NOT set publish/.next in the UI or here — that ships static chunks only
# and drops the SSR function (Netlify default "Page not found").

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  DATA_DIR = "/tmp/holly-would-data"
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
