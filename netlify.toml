# Holly Would — Netlify site: holly-would
#
# Required site settings (Devils Advocates collision fix):
#   Base directory:     web
#   Package directory:  (blank)
#   Build command:      npm run build
#   Publish directory:  .next   ← must NOT equal base (or Next plugin fails)
#   Node:               22
#
# Root config is intentionally minimal — with base=web Netlify reads web/netlify.toml.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  DATA_DIR = "/tmp/holly-would-data"
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_ENABLED = "false"
