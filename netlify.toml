# Holly Would monorepo root
# Netlify: Base directory = apps/web  (set in UI)
# This root file is a fallback if base is left at repo root.

[build]
  base = "apps/web"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  DATA_DIR = "/tmp/holly-would-data"

[[plugins]]
  package = "@netlify/plugin-nextjs"
