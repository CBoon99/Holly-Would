# Holly Would app (package directory = web)
# CRITICAL: no publish directory — @netlify/plugin-nextjs owns output + SSR function.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  DATA_DIR = "/tmp/holly-would-data"
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "ELEVENLABS_API_KEY,OPENAI_API_KEY,DEEPGRAM_API_KEY,CLERK_SECRET_KEY,DATABASE_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
