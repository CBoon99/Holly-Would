# Holly Would — Railway (primary host)
# Service root: web/  (set Root Directory = web in Railway UI if linking monorepo)
#
# After first deploy:
#   1. Attach a volume at /data (optional but recommended for SQLite durability)
#   2. Set DATA_DIR=/data
#   3. Set ELEVENLABS_API_KEY (+ optional DEEPGRAM/OPENAI)
#   4. Hit /api/bootstrap once

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npx next start -H 0.0.0.0 -p ${PORT:-3000}"
healthcheckPath = "/api/system/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
